let current = new Date();
current.setDate(1);

const jpDate = s => {
  const d = new Date(s+"T00:00:00");
  return `${d.getMonth()+1}/${d.getDate()}（${"日月火水木金土"[d.getDay()]}）`;
};
const rangeText = e => e.start===e.end ? jpDate(e.start) : `${jpDate(e.start)}〜${jpDate(e.end)}`;

function overlapsMonth(e,y,m){
  const first=`${y}-${String(m+1).padStart(2,"0")}-01`;
  const lastDate=new Date(y,m+1,0).getDate();
  const last=`${y}-${String(m+1).padStart(2,"0")}-${String(lastDate).padStart(2,"0")}`;
  return e.start<=last && e.end>=first;
}

function buildMonthSelect(){
  const sel=document.getElementById("monthSelect");
  sel.innerHTML="";
  for(let i=-6;i<=12;i++){
    const d=new Date(current.getFullYear(),current.getMonth()+i,1);
    const o=document.createElement("option");
    o.value=`${d.getFullYear()}-${d.getMonth()}`;
    o.textContent=`${d.getFullYear()}年${d.getMonth()+1}月`;
    sel.appendChild(o);
  }
  sel.value=`${current.getFullYear()}-${current.getMonth()}`;
}

function openModal(e){
  document.getElementById("modalDate").textContent=rangeText(e);
  document.getElementById("modalName").textContent=e.name;
  document.getElementById("modalPlace").textContent="📍 "+e.place;
  document.getElementById("modalType").textContent=e.type;
  document.getElementById("modalDesc").textContent=e.desc;
  document.getElementById("modal").classList.add("show");
}

function render(){
  buildMonthSelect();
  const y=current.getFullYear(),m=current.getMonth();
  document.getElementById("monthTitle").textContent=`${y}年${m+1}月`;
  const list=events.filter(e=>overlapsMonth(e,y,m)).sort((a,b)=>a.start.localeCompare(b.start));
  document.getElementById("count").textContent=`今月の掲載イベント：${list.length}件`;
  const box=document.getElementById("events");
  box.innerHTML="";
  if(!list.length){
    box.innerHTML='<div class="empty">この月のイベントはまだ登録されていません。</div>';
    return;
  }
  list.forEach(e=>{
    const div=document.createElement("button");
    div.className=`event ${e.level}`;
    const label=e.level==="high"?"仕事への影響に注意":e.level==="medium"?"混雑に注意":"参考イベント";
    div.innerHTML=`<div class="date">${rangeText(e)}</div>
      <div class="name">${e.name}</div>
      <div class="place">📍 ${e.place}</div>
      <span class="badge">${e.type} ・ ${label}</span>
      <div class="tap">タップするとイベント内容を表示</div>`;
    div.onclick=()=>openModal(e);
    box.appendChild(div);
  });
}

document.getElementById("prev").onclick=()=>{current.setMonth(current.getMonth()-1);render();};
document.getElementById("next").onclick=()=>{current.setMonth(current.getMonth()+1);render();};
document.getElementById("monthSelect").onchange=e=>{
  const [y,m]=e.target.value.split("-").map(Number);
  current=new Date(y,m,1);render();
};
document.getElementById("closeModal").onclick=()=>document.getElementById("modal").classList.remove("show");
document.getElementById("modal").onclick=e=>{
  if(e.target.id==="modal") document.getElementById("modal").classList.remove("show");
};
render();
</script>
